version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      android-build-toolchain:
        patterns:
          - "com.android.tools.build*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      android-libraries:
        patterns:
          - "*"
        exclude-patterns:
          - "com.android.tools.build*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
