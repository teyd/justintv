name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Ensure Android SDK packages
        run: |
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Assemble and test
        run: ./gradlew :app:assembleDebug testDebugUnitTest --stacktrace

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Lint
        run: ./gradlew lint

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
